[package]
name = "ferrolith_core"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
readme.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
description = "LR(1) automaton and table construction for the ferrolith parser generator"
keywords = ["parser", "parser-generator", "lr1", "grammar", "proc-macro"]
categories = ["parsing", "compilers"]

[dependencies]
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
syn = "2"

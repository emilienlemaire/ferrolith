[package]
name = "ferrolith_macro"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
readme.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
description = "Procedural macro implementation of the ferrolith parser generator"
keywords = ["parser", "parser-generator", "lr1", "grammar", "proc-macro"]
categories = ["parsing", "compilers"]

[lib]
proc-macro = true

[dependencies]
ferrolith_core = { path = "../ferrolith_core", version = "0.1" }
heck = "0.5.0"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
